

artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_url: "local" 
  raw_data_path: data/raw/dataset.csv
  train_data_path: artifacts/data_ingestion/train.csv
  test_data_path: artifacts/data_ingestion/test.csv
  stratify_column: "label"
  test_size: 0.2
  random_state: 42

data_transformation:
  root_dir: artifacts/data_transformation
  tokenizer_name: "distilbert-base-uncased"
  max_length: 128
  truncation: true
  padding: "max_length"

model_trainer:
  root_dir: artifacts/model_trainer
  model_checkpoint: "distilbert-base-uncased"
  trained_model_path: artifacts/model_trainer/distilbert_clf_model
  
  # Hyperparameters
  epochs: 3
  batch_size: 16
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 500
  fp16_precision: true 
  logging_steps: 10

model_evaluation:
  root_dir: artifacts/model_evaluation
  metrics_file: artifacts/model_evaluation/metrics.json
  confusion_matrix_img: artifacts/model_evaluation/confusion_matrix.png
  k_folds: 5